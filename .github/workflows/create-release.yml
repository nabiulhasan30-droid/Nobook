name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Persistent Keystore
        run: |
          mkdir -p keystore
          if [ -f keystore/release.keystore ]; then
            echo "Using existing persistent keystore..."
          elif [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Using custom keystore from secrets..."
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > keystore/release.keystore
          else
            echo "Generating permanent release keystore for repository..."
            keytool -genkeypair -v -keystore keystore/release.keystore \
              -alias nabiul_release_key -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass nabiul_app_key_2026 -keypass nabiul_app_key_2026 \
              -dname "CN=Facebook N, OU=Nabiul, O=Nabiul, L=Kolkata, ST=WB, C=IN"
            
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add keystore/release.keystore
            git commit -m "chore: Persist permanent release keystore for seamless app updates" || true
            git push origin HEAD:main || true
          fi
          echo "KEY_ALIAS=nabiul_release_key" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=nabiul_app_key_2026" >> $GITHUB_ENV
          echo "KEY_PASSWORD=nabiul_app_key_2026" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || { echo "Gradle build failed"; exit 1; }
          ls -R app/build/outputs/apk || echo "No APK directory found"

      - name: Sign APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "No build-tools found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            echo "apksigner not found at $APKSIGNER"
            exit 1
          fi
          
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "No APK found in app/build/outputs/apk/release"
            exit 1
          fi
          
          echo "Signing $RELEASE_APK with persistent keystore..."
          $APKSIGNER sign \
            --ks keystore/release.keystore \
            --ks-key-alias $KEY_ALIAS \
            --ks-pass pass:$KEYSTORE_PASSWORD \
            --key-pass pass:$KEY_PASSWORD \
            --out app-release.apk \
            "$RELEASE_APK"

          echo "Verifying APK signature..."
          $APKSIGNER verify --verbose --print-certs app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: app-release.apk
          compression-level: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Tag for Manual Trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || 'v1.0.0' }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME" || true

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-artifact

      - name: Rename APK for Release
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}"
          mv app-release.apk "Facebook_N_${TAG_NAME}.apk"
          if [ ! -f "Facebook_N_${TAG_NAME}.apk" ]; then
            echo "Failed to rename APK"
            exit 1
          fi

      - name: Prepare Changelog
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}"
          if [ ! -f CHANGE.md ]; then
            echo "### Facebook N Release ${TAG_NAME}" > CHANGE.txt
            echo "" >> CHANGE.txt
            echo "- Ad-free & lightweight Facebook browsing experience" >> CHANGE.txt
            echo "- Custom app icon and identity: Facebook N by Nabiul" >> CHANGE.txt
            echo "- Fast media downloads and customization options" >> CHANGE.txt
          else
            cp CHANGE.md CHANGE.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}
          name: Facebook N ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}
          files: Facebook_N_${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}.apk
          body_path: CHANGE.txt
